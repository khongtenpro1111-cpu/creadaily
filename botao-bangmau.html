<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bộ Tạo Bảng Màu</title>
    <link rel="icon" type="image/png" href="img/logo/favicon-round.png">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>

        h1, h2, h3, h4 {
            font-weight: 600;
        }

        /* ==================== BỐ CỤC CHUNG ==================== */
        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .main-container {
            max-width: 800px;
            margin: 0 auto 50px;
            padding: 35px 30px;
            text-align: center;
            background: var(--card-bg) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-lg, 20px) !important;
            border: 1px solid var(--card-border) !important;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4) !important;
        }

        .button-generator {
            padding: 12px 25px;
            border-radius: 25px;
            border: none;
            background-color: var(--main-color);
            color: var(--text-color);
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        
        .button-generator:hover {
            transform: translateY(-2px);
            background-color: var(--accent-color);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .color-palette-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 40px;
        }

        .color-box {
            width: 120px;
            height: 120px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .color-box:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.5);
        }

        .color-hex {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            color: var(--text-color);
            font-size: 0.9em;
            padding: 5px;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.3s ease;
            pointer-events: none;
        }
        
        .color-box:hover .color-hex {
            visibility: visible;
            opacity: 1;
        }

        /* ==================== MEDIA QUERIES (RESPONSIVE) ==================== */
        @media (max-width: 768px) {
            .main-container {
                padding: 20px;
            }
            .color-box {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>
    <div id="sidebar-placeholder"></div>

    <header class="header-inspiration" style="padding: 3rem 1rem; text-align: center;">
        <h1>Bộ Tạo Bảng Màu</h1>
        <p>Tạo ra những bảng màu tuyệt đẹp chỉ với một cú nhấp chuột</p>
    </header>

    <main>
        <div class="main-container">
            <h2>Tạo Bảng Màu Ngẫu Nhiên</h2>
            <button id="generate-btn" class="button-generator">Tạo Bảng Màu</button>
            <div id="palette-container" class="color-palette-grid">
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <div id="music-placeholder"></div>
    <div id="modals-placeholder"></div>

    <script src="layout.js"></script>
    <script src="main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const generateBtn = document.getElementById('generate-btn');
            const paletteContainer = document.getElementById('palette-container');

            function generateRandomColor() {
                const letters = '0123456789ABCDEF';
                let color = '#';
                for (let i = 0; i < 6; i++) {
                    color += letters[Math.floor(Math.random() * 16)];
                }
                return color;
            }

            function generatePalette() {
                paletteContainer.innerHTML = '';
                const numberOfColors = 20;
                for (let i = 0; i < numberOfColors; i++) {
                    const color = generateRandomColor();
                    const colorBox = document.createElement('div');
                    colorBox.classList.add('color-box');
                    colorBox.style.backgroundColor = color;
                    colorBox.innerHTML = `<span class="color-hex">${color}</span>`;
                    paletteContainer.appendChild(colorBox);
                }
            }
            
            // Tạo bảng màu ban đầu khi trang tải
            generatePalette();

            // Gán sự kiện cho nút
            generateBtn.addEventListener('click', generatePalette);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ Quản Lý Công Việc</title>
    <link rel="icon" type="image/png" href="img/logo/favicon-round.png">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            padding-bottom: 60px;
        }

        h1, h2, h3, h4 {
            font-family: 'Poppins', sans-serif;
            color: var(--main-color);
            text-align: center;
            font-weight: 600;
        }
        
        /* ==================== HIỆU ỨNG RIÊNG CHO CÔNG CỤ ==================== */
        .task-manager-container {
            max-width: 650px;
            margin: 0 auto 50px;
            padding: 35px 30px;
            text-align: center;
            background: var(--card-bg) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-lg, 20px) !important;
            border: 1px solid var(--card-border) !important;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4) !important;
        }

        .task-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .task-input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 1em;
        }

        .priority-select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .add-task-btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background-color: var(--main-color);
            color: var(--text-color);
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .add-task-btn:hover {
            background-color: var(--accent-color);
        }

        .task-filter-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-btn {
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--secondary-text-color);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--accent-color);
            color: var(--text-color);
            border-color: var(--accent-color);
        }

        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background-color: var(--bg-color);
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 5px solid var(--border-color);
            transition: all 0.3s ease;
        }
        
        .task-item.completed {
            text-decoration: line-through;
            opacity: 0.6;
        }
        
        .task-item.completed .task-text {
            color: var(--secondary-text-color);
        }

        .task-item.priority-high {
            border-left-color: var(--button-danger);
        }

        .task-item.priority-medium {
            border-left-color: #fca311;
        }

        .task-item.priority-low {
            border-left-color: var(--button-success);
        }

        .task-text {
            flex: 1;
            text-align: left;
            margin-left: 10px;
            cursor: pointer;
        }

        .task-actions {
            display: flex;
            gap: 10px;
        }

        .task-action-btn {
            background: none;
            border: none;
            color: var(--secondary-text-color);
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .task-action-btn:hover {
            color: var(--text-color);
        }

        .task-action-btn.delete:hover {
            color: var(--button-danger);
        }

        /* Thêm style cho thanh thông báo */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            transform: translateY(-20px);
        }

        .notification.show {
            opacity: 1;
            transform: translateY(0);
        }

        .notification.success {
            background-color: var(--button-success);
        }

        .notification.danger {
            background-color: var(--button-danger);
        }

        /* Thêm ô tìm kiếm và sắp xếp */
        .search-sort-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .search-sort-controls input,
        .search-sort-controls select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 0.9em;
        }
        
        .search-sort-controls input {
            flex: 1;
            margin-right: 10px;
        }
        
        .task-counter {
            text-align: left;
            margin-top: 15px;
            font-size: 0.9em;
            color: var(--secondary-text-color);
        }

        /* ==================== MEDIA QUERIES (RESPONSIVE) ==================== */
        @media (max-width: 768px) {
            .task-manager-container {
                padding: 20px;
            }
            .search-sort-controls {
                flex-direction: column;
                align-items: stretch;
            }
            .search-sort-controls input {
                margin-right: 0;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>
    <div id="sidebar-placeholder"></div>
    <div id="notification-bar" class="notification"></div>

    <header class="header-inspiration" style="padding: 3rem 1rem; text-align: center;">
        <h1>Công Cụ Quản Lý Công Việc</h1>
        <p>Sắp xếp các ý tưởng và công việc của bạn</p>
    </header>

    <main style="padding: 2rem 1rem;">
        <div class="task-manager-container">
            <h2>Danh Sách Công Việc</h2>
            <div class="search-sort-controls">
                <input type="text" id="search-input" placeholder="Tìm kiếm công việc...">
                <select id="sort-select">
                    <option value="newest">Sắp xếp theo: Mới nhất</option>
                    <option value="oldest">Sắp xếp theo: Cũ nhất</option>
                    <option value="priority-desc">Độ ưu tiên: Cao -> Thấp</option>
                    <option value="priority-asc">Độ ưu tiên: Thấp -> Cao</option>
                </select>
            </div>
            
            <div class="task-input-group">
                <input type="text" id="task-input" class="task-input" placeholder="Nhập công việc mới...">
                <select id="priority-select" class="priority-select">
                    <option value="low">Thấp</option>
                    <option value="medium" selected>Trung bình</option>
                    <option value="high">Cao</option>
                </select>
                <button id="add-btn" class="add-task-btn">Thêm</button>
            </div>

            <div class="task-filter-group">
                <button class="filter-btn active" data-filter="all">Tất cả</button>
                <button class="filter-btn" data-filter="pending">Chưa xong</button>
                <button class="filter-btn" data-filter="completed">Đã xong</button>
            </div>
            <ul id="task-list" class="task-list">
                <!-- Các item công việc sẽ được thêm vào đây bằng Javascript -->
            </ul>
            <div class="task-counter">
                <span id="total-tasks">Tổng: 0</span> | 
                <span id="completed-tasks">Hoàn thành: 0</span> | 
                <span id="incomplete-tasks">Chưa xong: 0</span>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <div id="music-placeholder"></div>
    <div id="modals-placeholder"></div>

    <script src="layout.js"></script>
    <script src="main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const taskInput = document.getElementById('task-input');
            const prioritySelect = document.getElementById('priority-select');
            const addBtn = document.getElementById('add-btn');
            const taskList = document.getElementById('task-list');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const notificationBar = document.getElementById('notification-bar');
            const searchInput = document.getElementById('search-input');
            const sortSelect = document.getElementById('sort-select');
            const totalTasksEl = document.getElementById('total-tasks');
            const completedTasksEl = document.getElementById('completed-tasks');
            const incompleteTasksEl = document.getElementById('incomplete-tasks');

            let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
            let currentFilter = 'all';

            function showNotification(message, type) {
                notificationBar.textContent = message;
                notificationBar.classList.add(type);
                notificationBar.style.top = '0';
                setTimeout(() => {
                    notificationBar.style.top = '-100px';
                    setTimeout(() => {
                        notificationBar.classList.remove(type);
                    }, 500);
                }, 2000);
            }

            function updateTaskCount() {
                const completedCount = tasks.filter(task => task.completed).length;
                totalTasksEl.textContent = `Tổng: ${tasks.length}`;
                completedTasksEl.textContent = `Hoàn thành: ${completedCount}`;
                incompleteTasksEl.textContent = `Chưa xong: ${tasks.length - completedCount}`;
            }

            function renderTasks() {
                taskList.innerHTML = '';
                
                let filteredTasks = tasks.filter(task => {
                    if (currentFilter === 'completed') return task.completed;
                    if (currentFilter === 'incomplete') return !task.completed;
                    return true;
                });
                
                const searchQuery = searchInput.value.toLowerCase();
                if (searchQuery) {
                    filteredTasks = filteredTasks.filter(task => 
                        task.text.toLowerCase().includes(searchQuery)
                    );
                }
                
                const sortOrder = sortSelect.value;
                filteredTasks.sort((a, b) => {
                    if (sortOrder === 'newest') return b.id - a.id;
                    if (sortOrder === 'oldest') return a.id - b.id;
                    if (sortOrder === 'priority-high') {
                        const priorityMap = { 'high': 3, 'medium': 2, 'low': 1 };
                        return priorityMap[b.priority] - priorityMap[a.priority];
                    }
                    if (sortOrder === 'priority-low') {
                        const priorityMap = { 'high': 3, 'medium': 2, 'low': 1 };
                        return priorityMap[a.priority] - priorityMap[b.priority];
                    }
                    return 0;
                });

                filteredTasks.forEach(task => {
                    const li = document.createElement('li');
                    li.classList.add('task-item');
                    if (task.completed) {
                        li.classList.add('completed');
                    }
                    const priorityClass = `priority-${task.priority}`;
                    li.innerHTML = `
                        <input type="checkbox" ${task.completed ? 'checked' : ''} data-id="${task.id}">
                        <span class="priority-marker ${priorityClass}"></span>
                        <span>${task.text}</span>
                        <button class="edit-btn" data-id="${task.id}">Sửa</button>
                        <button class="remove-btn" data-id="${task.id}">×</button>
                    `;
                    taskList.appendChild(li);
                });
                
                updateTaskCount();
            }

            function saveTasks() {
                localStorage.setItem('tasks', JSON.stringify(tasks));
            }

            function addTask() {
                const taskText = taskInput.value.trim();
                const priority = prioritySelect.value;
                if (taskText !== '') {
                    const newTask = { 
                        id: Date.now(), 
                        text: taskText, 
                        completed: false, 
                        priority: priority 
                    };
                    tasks.push(newTask);
                    taskInput.value = '';
                    saveTasks();
                    renderTasks();
                    showNotification('Công việc đã được thêm!', 'success');
                } else {
                    showNotification('Vui lòng nhập công việc!', 'error');
                }
            }
            
            function editTask(taskId) {
                const taskIndex = tasks.findIndex(t => t.id == taskId);
                const newText = prompt('Chỉnh sửa công việc:', tasks[taskIndex].text);
                if (newText !== null && newText.trim() !== '') {
                    tasks[taskIndex].text = newText.trim();
                    saveTasks();
                    renderTasks();
                    showNotification('Công việc đã được cập nhật!', 'success');
                } else if (newText !== null) {
                    showNotification('Nội dung không được để trống!', 'error');
                }
            }

            function handleTaskActions(event) {
                const target = event.target;
                const taskId = parseInt(target.dataset.id);
                
                if (target.type === 'checkbox') {
                    const task = tasks.find(t => t.id === taskId);
                    if (task) {
                        task.completed = target.checked;
                        saveTasks();
                        renderTasks();
                        if (target.checked) {
                            showNotification('Hoàn thành công việc!', 'success');
                        }
                    }
                } else if (target.classList.contains('remove-btn')) {
                    if (confirm('Bạn có chắc chắn muốn xóa công việc này không?')) {
                        tasks = tasks.filter(t => t.id !== taskId);
                        saveTasks();
                        renderTasks();
                        showNotification('Công việc đã được xóa!', 'success');
                    }
                } else if (target.classList.contains('edit-btn')) {
                    editTask(taskId);
                }
            }

            function handleFilter(event) {
                filterBtns.forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
                currentFilter = event.target.dataset.filter;
                renderTasks();
            }

            addBtn.addEventListener('click', addTask);
            taskInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    addTask();
                }
            });
            taskList.addEventListener('click', handleTaskActions);
            filterBtns.forEach(btn => btn.addEventListener('click', handleFilter));
            searchInput.addEventListener('input', renderTasks);
            sortSelect.addEventListener('change', renderTasks);

            // Hiển thị công việc ban đầu
            renderTasks();
        });
    </script>
</body>
</html>

<!-- Floating Action Controls (Lên Đầu Trang, Xuống Cuối Trang, Bật/Tắt Nhạc Icon-Only Compact) -->
<div class="floating-controls">
    <button id="scroll-to-top-btn" class="float-btn scroll-top-btn" title="Lên đầu trang" aria-label="Lên đầu trang">
        <i class="fas fa-chevron-up"></i>
    </button>

    <button id="music-toggle-btn" class="float-btn float-music-btn" title="Bật/Tắt nhạc nền" aria-label="Bật/Tắt nhạc nền">
        <i class="fas fa-volume-mute"></i>
    </button>
    
    <button id="scroll-to-bottom-btn" class="float-btn scroll-bottom-btn" title="Xuống cuối trang" aria-label="Xuống cuối trang">
        <i class="fas fa-chevron-down"></i>
    </button>
</div>

<audio id="background-music" loop>
    <source src="audio/suoi-rung-nuoi-duong-tam-hon-nhac-nen-video-223493.mp3" type="audio/mpeg">
    Trình duyệt của bạn không hỗ trợ thẻ audio.
</audio>

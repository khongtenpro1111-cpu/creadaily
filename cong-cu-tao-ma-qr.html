<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ Tạo Mã QR</title>
    <link rel="icon" type="image/png" href="img/logo/favicon-round.png">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            padding-bottom: 60px;
        }

        h1, h2, h3, h4 {
            font-weight: 600;
        }

        /* ==================== GIAO DIỆN CHÍNH CỦA CÔNG CỤ TẠO MÃ QR ==================== */
        .qr-generator-container {
            max-width: 950px;
            margin: 0 auto 50px;
            padding: 30px;
            background: var(--card-bg) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-lg, 20px) !important;
            border: 1px solid var(--card-border) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4) !important;
            text-align: left;
        }

        .qr-layout-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            align-items: start;
        }

        .qr-card-section {
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md, 14px);
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .qr-section-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-color);
            margin: 0 0 4px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }

        .qr-section-title i {
            color: var(--main-color);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--secondary-text-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .data-type-select,
        .qr-input,
        .qr-select {
            width: 100%;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: rgba(0, 0, 0, 0.3);
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .data-type-select:focus,
        .qr-input:focus,
        .qr-select:focus {
            border-color: var(--main-color);
            box-shadow: 0 0 8px var(--glow-color);
        }

        .data-type-select option,
        .qr-select option {
            background-color: #121827;
            color: var(--text-color);
        }

        .input-group-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Customize Options Grid */
        .qr-options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-top: 6px;
        }

        .qr-option-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .qr-option-card label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--secondary-text-color);
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-picker-wrapper input[type="color"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
            border: 2px solid var(--border-color);
            border-radius: 50%;
        }

        .color-val-text {
            font-size: 0.85rem;
            font-family: monospace;
            color: var(--text-color);
        }

        .file-upload-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .file-upload-btn:hover {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .checkbox-card {
            grid-column: span 2;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .checkbox-card input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--main-color);
            cursor: pointer;
        }

        /* Right Column Preview Box */
        .qr-preview-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .qr-code-box {
            width: 100%;
            min-height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background-color: white;
            border-radius: var(--radius-md, 14px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
            overflow: hidden;
        }

        .qr-code-box img, .qr-code-box canvas {
            max-width: 100%;
            height: auto !important;
            display: block;
        }

        .qr-note {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: rgba(0, 0, 0, 0.3);
            color: var(--text-color);
            font-size: 0.9rem;
            box-sizing: border-box;
            resize: vertical;
            min-height: 70px;
            outline: none;
            transition: all 0.3s ease;
        }

        .qr-note:focus {
            border-color: var(--main-color);
            box-shadow: 0 0 8px var(--glow-color);
        }

        .action-button-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn-primary, .btn-secondary, .btn-outline {
            flex: 1;
            padding: 11px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--main-color), #4361ee);
            color: white;
            box-shadow: 0 4px 15px rgba(247, 37, 133, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--glow-color);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--accent-color), #3b82f6);
            color: white;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-color);
            border-color: var(--border-color);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        /* History Modal */
        .qr-history-modal {
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .qr-history-modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 28px;
            border-radius: var(--radius-lg, 20px);
            width: 100%;
            max-width: 650px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            text-align: left;
        }

        .qr-history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
            margin-top: 18px;
        }

        .qr-history-item {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: rgba(11, 15, 25, 0.6);
            text-align: center;
            font-size: 0.82rem;
            color: var(--text-color);
            word-break: break-word;
        }

        .qr-history-item img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            margin-bottom: 8px;
            background: white;
            padding: 4px;
        }

        /* Responsive */
        @media (max-width: 820px) {
            .qr-layout-grid {
                grid-template-columns: 1fr;
            }
            .qr-options-grid {
                grid-template-columns: 1fr;
            }
            .checkbox-card {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>
    <div id="sidebar-placeholder"></div>

    <div id="qr-history-modal" class="qr-history-modal">
        <div class="qr-history-modal-content">
            <h3 style="margin-top: 0; display: flex; align-items: center; gap: 8px;"><i class="fas fa-history" style="color: var(--main-color);"></i> Lịch Sử Mã QR</h3>
            <div id="qr-history-grid" class="qr-history-grid"></div>
            <div style="text-align: right; margin-top: 20px;">
                <button id="close-qr-history-btn" class="btn-outline">Đóng</button>
            </div>
        </div>
    </div>
    <header class="header-inspiration" style="padding: 3rem 1rem; text-align: center;">
        <h1><i class="fas fa-qrcode" style="margin-right: 10px; color: var(--main-color);"></i>Công Cụ Tạo Mã QR</h1>
        <p>Tạo và tùy chỉnh mã QR sắc nét cho Website, Wi-Fi, Danh bạ và Văn bản</p>
    </header>

    <main>
        <div class="qr-generator-container">
            <div class="qr-layout-grid">
                <!-- Left Side: Form Controls -->
                <div class="qr-card-section">
                    <h3 class="qr-section-title"><i class="fas fa-sliders-h"></i> Cấu Hình Mã QR</h3>

                    <div class="form-group">
                        <label for="data-type-select"><i class="fas fa-layer-group"></i> Loại dữ liệu</label>
                        <select id="data-type-select" class="data-type-select">
                            <option value="text">Văn bản / Đường dẫn (URL)</option>
                            <option value="wifi">Mạng Wi-Fi</option>
                            <option value="vcard">V-Card (Thông tin liên hệ)</option>
                        </select>
                    </div>

                    <div id="text-input-group" class="form-group">
                        <label for="qr-text"><i class="fas fa-link"></i> Nội dung văn bản hoặc URL</label>
                        <input type="text" id="qr-text" class="qr-input" placeholder="Nhập đường dẫn https://... hoặc nội dung bất kỳ">
                    </div>

                    <div id="wifi-input-group" class="input-group-stack" style="display: none;">
                        <div class="form-group">
                            <label for="wifi-ssid"><i class="fas fa-wifi"></i> Tên Wi-Fi (SSID)</label>
                            <input type="text" id="wifi-ssid" class="qr-input" placeholder="Nhập tên mạng Wi-Fi">
                        </div>
                        <div class="form-group">
                            <label for="wifi-password"><i class="fas fa-key"></i> Mật khẩu Wi-Fi</label>
                            <input type="password" id="wifi-password" class="qr-input" placeholder="Nhập mật khẩu Wi-Fi">
                        </div>
                    </div>

                    <div id="vcard-input-group" class="input-group-stack" style="display: none;">
                        <div class="form-group">
                            <label for="vcard-name"><i class="fas fa-user"></i> Họ & Tên</label>
                            <input type="text" id="vcard-name" class="qr-input" placeholder="Nguyễn Văn A">
                        </div>
                        <div class="form-group">
                            <label for="vcard-phone"><i class="fas fa-phone"></i> Số điện thoại</label>
                            <input type="text" id="vcard-phone" class="qr-input" placeholder="0901234567">
                        </div>
                        <div class="form-group">
                            <label for="vcard-email"><i class="fas fa-envelope"></i> Địa chỉ Email</label>
                            <input type="email" id="vcard-email" class="qr-input" placeholder="email@example.com">
                        </div>
                    </div>

                    <div class="qr-options-grid">
                        <div class="qr-option-card">
                            <label>Màu mã QR</label>
                            <div class="color-picker-wrapper">
                                <input type="color" id="qr-color" value="#000000">
                                <span id="qr-color-val" class="color-val-text">#000000</span>
                            </div>
                        </div>

                        <div class="qr-option-card">
                            <label>Màu nền</label>
                            <div class="color-picker-wrapper">
                                <input type="color" id="qr-bg-color" value="#ffffff">
                                <span id="qr-bg-val" class="color-val-text">#ffffff</span>
                            </div>
                        </div>

                        <div class="qr-option-card">
                            <label for="qr-size">Kích thước (px)</label>
                            <input type="number" id="qr-size" class="qr-select" value="256" min="100" max="1024">
                        </div>

                        <div class="qr-option-card">
                            <label for="qr-correction-level">Độ nét / Sửa lỗi</label>
                            <select id="qr-correction-level" class="qr-select">
                                <option value="L">L (Thấp - 7%)</option>
                                <option value="M">M (Vừa - 15%)</option>
                                <option value="Q">Q (Cao - 25%)</option>
                                <option value="H" selected>H (Rất cao - 30%)</option>
                            </select>
                        </div>

                        <div class="qr-option-card">
                            <label>Chèn Logo (Giữa)</label>
                            <input type="file" id="logo-upload" accept="image/*" style="display: none;">
                            <label for="logo-upload" class="file-upload-btn">
                                <i class="fas fa-upload"></i> Chọn ảnh Logo
                            </label>
                        </div>

                        <div class="qr-option-card checkbox-card">
                            <label for="transparent-bg" style="cursor: pointer;">Nền trong suốt</label>
                            <input type="checkbox" id="transparent-bg">
                        </div>
                    </div>
                </div>

                <!-- Right Side: Preview & Actions -->
                <div class="qr-card-section qr-preview-wrapper">
                    <h3 class="qr-section-title" style="width: 100%;"><i class="fas fa-qrcode"></i> Xem Trước Mã QR</h3>

                    <div id="qrcode" class="qr-code-box"></div>

                    <textarea id="qr-note" class="qr-note" placeholder="Nhập ghi chú ngắn bên dưới mã QR..."></textarea>

                    <div class="action-button-group">
                        <div class="btn-row">
                            <button id="download-png" class="btn-primary"><i class="fas fa-download"></i> Tải PNG</button>
                            <button id="download-svg" class="btn-secondary"><i class="fas fa-file-code"></i> Tải SVG</button>
                        </div>
                        <div class="btn-row">
                            <button id="show-history-btn" class="btn-outline"><i class="fas fa-history"></i> Lịch Sử</button>
                            <button id="share-btn" class="btn-outline"><i class="fas fa-share-alt"></i> Chia Sẻ</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <div id="music-placeholder"></div>
    <div id="modals-placeholder"></div>

    <script src="layout.js"></script>
    <script src="main.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dataTypeSelect = document.getElementById('data-type-select');
            const qrText = document.getElementById('qr-text');
            const wifiSsid = document.getElementById('wifi-ssid');
            const wifiPassword = document.getElementById('wifi-password');
            const vcardName = document.getElementById('vcard-name');
            const vcardPhone = document.getElementById('vcard-phone');
            const vcardEmail = document.getElementById('vcard-email');
            const qrcodeEl = document.getElementById('qrcode');
            const qrColor = document.getElementById('qr-color');
            const qrBgColor = document.getElementById('qr-bg-color');
            const qrColorVal = document.getElementById('qr-color-val');
            const qrBgVal = document.getElementById('qr-bg-val');
            const qrSize = document.getElementById('qr-size');
            const qrCorrectionLevel = document.getElementById('qr-correction-level');
            const logoUpload = document.getElementById('logo-upload');
            const transparentBg = document.getElementById('transparent-bg');
            const downloadPngBtn = document.getElementById('download-png');
            const downloadSvgBtn = document.getElementById('download-svg');
            const showHistoryBtn = document.getElementById('show-history-btn');
            const historyModal = document.getElementById('qr-history-modal');
            const historyGrid = document.getElementById('qr-history-grid');
            const closeHistoryBtn = document.getElementById('close-qr-history-btn');
            const textInputGroup = document.getElementById('text-input-group');
            const wifiInputGroup = document.getElementById('wifi-input-group');
            const vcardInputGroup = document.getElementById('vcard-input-group');
            const qrNote = document.getElementById('qr-note');
            const shareBtn = document.getElementById('share-btn');
            
            let qrcodeInstance = null;
            let logoImage = null;

            function getQrData() {
                const type = dataTypeSelect.value;
                let data = '';
                if (type === 'text') {
                    data = qrText.value.trim() || 'https://www.google.com';
                } else if (type === 'wifi') {
                    const ssid = wifiSsid.value.trim();
                    const pass = wifiPassword.value.trim();
                    data = `WIFI:S:${ssid};T:WPA;P:${pass};;`;
                } else if (type === 'vcard') {
                    const name = vcardName.value.trim();
                    const phone = vcardPhone.value.trim();
                    const email = vcardEmail.value.trim();
                    data = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nTEL:${phone}\nEMAIL:${email}\nEND:VCARD`;
                }
                return data;
            }
            
            function combineQrCodeAndLogo(qrCanvas, logo, noteText) {
                const finalCanvas = document.createElement('canvas');
                const ctx = finalCanvas.getContext('2d');
                const size = qrCanvas.width;
                const noteHeight = noteText ? 50 : 0;
                
                finalCanvas.width = size;
                finalCanvas.height = size + noteHeight;
                
                // Set background color
                ctx.fillStyle = transparentBg.checked ? 'transparent' : qrBgColor.value;
                ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
                
                // Draw QR code onto the final canvas
                ctx.drawImage(qrCanvas, 0, 0, size, size);

                // If there's a logo, draw it on top
                if (logo && logo.complete) {
                    const logoSize = size * 0.2;
                    const x = (size - logoSize) / 2;
                    const y = (size - logoSize) / 2;
                    ctx.drawImage(logo, x, y, logoSize, logoSize);
                }
                
                // Draw the note text below the QR code
                if (noteText) {
                    ctx.fillStyle = transparentBg.checked ? '#ffffff' : (qrColor.value || '#000000');
                    ctx.font = '16px Poppins, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(noteText, size / 2, size + 30);
                }
                
                return finalCanvas;
            }

            function generateQrCode() {
                if (qrColorVal) qrColorVal.textContent = qrColor.value;
                if (qrBgVal) qrBgVal.textContent = qrBgColor.value;

                const textValue = getQrData();
                const color = qrColor.value;
                const bgColor = transparentBg.checked ? 'transparent' : qrBgColor.value;
                const size = parseInt(qrSize.value) || 256;
                const correctionLevel = qrCorrectionLevel.value;

                if (qrcodeInstance) {
                    qrcodeInstance.clear();
                    qrcodeInstance = null;
                }
                
                qrcodeInstance = new QRCode(qrcodeEl, {
                    text: textValue,
                    width: size,
                    height: size,
                    colorDark: color,
                    colorLight: bgColor,
                    correctLevel: QRCode.CorrectLevel[correctionLevel]
                });
                
                // Wait for the QR code to finish rendering its canvas
                setTimeout(() => {
                    const qrCanvas = qrcodeEl.querySelector('canvas');
                    if (qrCanvas) {
                        const finalCanvas = combineQrCodeAndLogo(qrCanvas, logoImage, qrNote.value.trim());
                        qrcodeEl.innerHTML = '';
                        qrcodeEl.appendChild(finalCanvas);
                        saveToHistory(finalCanvas);
                    }
                }, 50);
            }

            function saveToHistory(canvas) {
                const history = JSON.parse(localStorage.getItem('qr-history')) || [];
                const qrDataUrl = canvas.toDataURL("image/png");
                const historyItem = {
                    data: getQrData(),
                    url: qrDataUrl,
                    note: qrNote.value.trim()
                };
                
                const isDuplicate = history.some(item => item.url === qrDataUrl);
                if (!isDuplicate) {
                    history.unshift(historyItem);
                    if (history.length > 10) {
                        history.pop();
                    }
                    localStorage.setItem('qr-history', JSON.stringify(history));
                }
            }
            
            function renderHistory() {
                const history = JSON.parse(localStorage.getItem('qr-history')) || [];
                historyGrid.innerHTML = '';
                if (history.length === 0) {
                    historyGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--secondary-text-color);">Chưa có mã QR nào được lưu trong lịch sử.</p>';
                    return;
                }
                history.forEach(item => {
                    const div = document.createElement('div');
                    div.classList.add('qr-history-item');
                    div.innerHTML = `<img src="${item.url}" alt="QR Code"><p style="margin: 4px 0 0 0; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">${item.data}</p>`;
                    historyGrid.appendChild(div);
                });
            }

            generateQrCode();

            dataTypeSelect.addEventListener('change', () => {
                textInputGroup.style.display = 'none';
                wifiInputGroup.style.display = 'none';
                vcardInputGroup.style.display = 'none';
                
                if (dataTypeSelect.value === 'text') textInputGroup.style.display = 'flex';
                if (dataTypeSelect.value === 'wifi') wifiInputGroup.style.display = 'flex';
                if (dataTypeSelect.value === 'vcard') vcardInputGroup.style.display = 'flex';
                
                generateQrCode();
            });

            qrText.addEventListener('input', generateQrCode);
            wifiSsid.addEventListener('input', generateQrCode);
            wifiPassword.addEventListener('input', generateQrCode);
            vcardName.addEventListener('input', generateQrCode);
            vcardPhone.addEventListener('input', generateQrCode);
            vcardEmail.addEventListener('input', generateQrCode);
            qrColor.addEventListener('input', generateQrCode);
            qrBgColor.addEventListener('input', generateQrCode);
            qrSize.addEventListener('input', generateQrCode);
            qrCorrectionLevel.addEventListener('change', generateQrCode);
            transparentBg.addEventListener('change', generateQrCode);
            qrNote.addEventListener('input', generateQrCode);

            logoUpload.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        logoImage = new Image();
                        logoImage.src = e.target.result;
                        logoImage.onload = generateQrCode;
                    };
                    reader.readAsDataURL(file);
                } else {
                    logoImage = null;
                    generateQrCode();
                }
            });

            downloadPngBtn.addEventListener('click', () => {
                const canvas = qrcodeEl.querySelector('canvas');
                if (canvas) {
                    const qrDataUrl = canvas.toDataURL("image/png");
                    const link = document.createElement('a');
                    link.href = qrDataUrl;
                    link.download = 'qrcode.png';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            });
            
            downloadSvgBtn.addEventListener('click', () => {
                const svg = qrcodeEl.querySelector('svg');
                if (svg) {
                    const svgDataUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg.outerHTML)}`;
                    const link = document.createElement('a');
                    link.href = svgDataUrl;
                    link.download = 'qrcode.svg';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            });
            
            showHistoryBtn.addEventListener('click', () => {
                renderHistory();
                historyModal.style.display = 'flex';
            });

            closeHistoryBtn.addEventListener('click', () => {
                historyModal.style.display = 'none';
            });

            shareBtn.addEventListener('click', async () => {
                const finalCanvas = qrcodeEl.querySelector('canvas');
                if (!finalCanvas) return;

                const blob = await new Promise(resolve => finalCanvas.toBlob(resolve, 'image/png'));
                const file = new File([blob], 'qrcode.png', { type: 'image/png' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'Mã QR đã tạo',
                            text: qrNote.value.trim() || 'Chia sẻ mã QR từ Công Cụ Tạo Mã QR',
                        });
                    } catch (error) {
                        alert('Chia sẻ thất bại: ' + error.message);
                    }
                } else {
                    alert('Trình duyệt không hỗ trợ chia sẻ trực tiếp.');
        });
    </script>
</body>
</html>

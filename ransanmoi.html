<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Rắn Săn Mồi</title>
    <link rel="stylesheet" href="ransanmoi.css">
    <link rel="stylesheet" href="mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header-game">
        <a href="trochoi.html" class="back-link">
            <button class="game-btn">Quay lại</button>
        </a>
        <h1>Rắn Săn Mồi</h1>
        <p class="desktop-instruction">Sử dụng các phím mũi tên để di chuyển!</p>
        <p class="mobile-instruction">Sử dụng các nút bên dưới để di chuyển!</p>
    </header>

    <main>
        <div id="game-container">
            <canvas id="game-board" width="400" height="400"></canvas>
            <div id="game-info">
                <p>Điểm: <span id="score">0</span></p>
                <div id="status">Nhấn Bắt đầu để chơi!</div>
                <button id="start-btn" class="game-btn">Bắt đầu</button>
            </div>
            
            <div id="mobile-controls">
                <button class="control-btn" data-direction="up">▲</button>
                <div class="horizontal-controls">
                    <button class="control-btn" data-direction="left">◄</button>
                    <button class="control-btn" data-direction="right">►</button>
                </div>
                <button class="control-btn" data-direction="down">▼</button>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('game-board');
            const ctx = canvas.getContext('2d');
            const scoreDisplay = document.getElementById('score');
            const startBtn = document.getElementById('start-btn');
            const statusDiv = document.getElementById('status');
            const mobileControls = document.getElementById('mobile-controls');
            
            const TILE_SIZE = 20;
            const BOARD_SIZE = 20;
            canvas.width = TILE_SIZE * BOARD_SIZE;
            canvas.height = TILE_SIZE * BOARD_SIZE;
            
            let snake = [];
            let food = {};
            let dx = 0;
            let dy = 0;
            let score = 0;
            let gameInterval;
            let gameRunning = false;
            let changedDirection = false;
            let gameSpeed = 150;

            function draw() {
                ctx.fillStyle = '#1e1e2d';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                snake.forEach(segment => {
                    ctx.fillStyle = '#52b788';
                    ctx.fillRect(segment.x * TILE_SIZE, segment.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    ctx.strokeStyle = '#f0f0f0';
                    ctx.strokeRect(segment.x * TILE_SIZE, segment.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                });

                ctx.fillStyle = '#e63964';
                ctx.beginPath();
                ctx.arc(food.x * TILE_SIZE + TILE_SIZE / 2, food.y * TILE_SIZE + TILE_SIZE / 2, TILE_SIZE / 2, 0, 2 * Math.PI);
                ctx.fill();
            }

            function update() {
                if (!gameRunning) return;

                const head = { x: snake[0].x + dx, y: snake[0].y + dy };
                snake.unshift(head);
                changedDirection = false;

                if (head.x === food.x && head.y === food.y) {
                    score++;
                    scoreDisplay.textContent = score;
                    generateFood();
                    gameSpeed = Math.max(80, gameSpeed - 2);
                    clearInterval(gameInterval);
                    gameInterval = setInterval(update, gameSpeed);
                } else {
                    snake.pop();
                }

                if (head.x < 0 || head.x >= BOARD_SIZE || head.y < 0 || head.y >= BOARD_SIZE) {
                    endGame();
                }

                for (let i = 1; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        endGame();
                        return;
                    }
                }

                draw();
            }

            function generateFood() {
                food = {
                    x: Math.floor(Math.random() * BOARD_SIZE),
                    y: Math.floor(Math.random() * BOARD_SIZE)
                };
            }

            function setDirection(direction) {
                if (!gameRunning || changedDirection) return;
                changedDirection = true;
                if (direction === 'left' && dx === 0) {
                    dx = -1;
                    dy = 0;
                } else if (direction === 'up' && dy === 0) {
                    dx = 0;
                    dy = -1;
                } else if (direction === 'right' && dx === 0) {
                    dx = 1;
                    dy = 0;
                } else if (direction === 'down' && dy === 0) {
                    dx = 0;
                    dy = 1;
                }
            }
            
            function startGame() {
                if (gameRunning) return;
                gameRunning = true;
                statusDiv.textContent = '';
                snake = [{ x: 10, y: 10 }];
                dx = 1;
                dy = 0;
                score = 0;
                scoreDisplay.textContent = score;
                gameSpeed = 150;
                generateFood();
                clearInterval(gameInterval);
                gameInterval = setInterval(update, gameSpeed);
                startBtn.textContent = 'Chơi lại';
                
                // Hiển thị khung canvas ban đầu
                draw(); 
            }

            function endGame() {
                clearInterval(gameInterval);
                gameRunning = false;
                statusDiv.textContent = `Game Over! Điểm của bạn: ${score}.`;
                startBtn.textContent = 'Bắt đầu';
            }

            // Xử lý sự kiện bàn phím
            document.addEventListener('keydown', (event) => {
                const keyPressed = event.key;
                const directionMap = { 'ArrowLeft': 'left', 'ArrowRight': 'right', 'ArrowUp': 'up', 'ArrowDown': 'down' };
                if (directionMap[keyPressed]) {
                    setDirection(directionMap[keyPressed]);
                }
            });

            // Xử lý sự kiện click trên nút ảo
            mobileControls.addEventListener('click', (event) => {
                const direction = event.target.dataset.direction;
                if (direction) {
                    setDirection(direction);
                }
            });

            startBtn.addEventListener('click', startGame);
            
            // Vẽ khung game ban đầu
            draw();
        });
    </script>
</body>
</html>

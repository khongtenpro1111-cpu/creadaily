<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #70c5ce;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
        }
        
        #game-canvas {
            background-color: #70c5ce;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            display: block;
        }
        
        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
        }
        
        #game-over-screen {
            display: none;
        }
        
        h1 {
            font-size: 36px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 20px;
        }
        
        button:hover {
            background-color: #ff5252;
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="score-display">0</div>
        <div id="start-screen">
            <h1>Flappy Bird</h1>
            <p>Press Spacebar to jump</p>
            <button id="start-button">Start Game</button>
        </div>
        <div id="game-over-screen">
            <h1>Game Over</h1>
            <p id="final-score">Score: 0</p>
            <button id="restart-button">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startButton = document.getElementById('start-button');
        const restartButton = document.getElementById('restart-button');
        const scoreDisplay = document.getElementById('score-display');
        const finalScoreDisplay = document.getElementById('final-score');
        
        // Game variables
        let gameRunning = false;
        let score = 0;
        let gravity = 0.5;
        let bird = {
            x: 100,
            y: canvas.height / 2,
            width: 30,
            height: 24,
            velocity: 0,
            jump: function() {
                this.velocity = -8;
            }
        };
        
        let pipes = [];
        let frameCount = 0;
        let pipeGap = 150;
        let pipeFrequency = 120;
        
        // Event listeners
        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', restartGame);
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                if (!gameRunning) {
                    startGame();
                } else {
                    bird.jump();
                }
                e.preventDefault();
            }
        });
        
        // Start game function
        function startGame() {
            gameRunning = true;
            pipes = [];
            bird.y = canvas.height / 2;
            bird.velocity = 0;
            score = 0;
            scoreDisplay.textContent = '0';
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            
            // Start game loop
            requestAnimationFrame(gameLoop);
        }
        
        // Game loop
        function gameLoop() {
            if (!gameRunning) return;
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Update bird
            bird.velocity += gravity;
            bird.y += bird.velocity;
            
            // Draw bird
            ctx.fillStyle = '#ffdd59';
            ctx.beginPath();
            ctx.ellipse(bird.x, bird.y, bird.width, bird.height, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
            
            // Eyes
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(bird.x + 10, bird.y - 5, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Beak
            ctx.fillStyle = '#ff9f43';
            ctx.beginPath();
            ctx.moveTo(bird.x + 15, bird.y);
            ctx.lineTo(bird.x + 25, bird.y - 5);
            ctx.lineTo(bird.x + 25, bird.y + 5);
            ctx.closePath();
            ctx.fill();
            
            // Generate pipes
            if (frameCount % pipeFrequency === 0) {
                const pipeHeight = Math.floor(Math.random() * (canvas.height - pipeGap - 100)) + 50;
                pipes.push({
                    x: canvas.width,
                    height: pipeHeight,
                    passed: false
                });
                pipes.push({
                    x: canvas.width,
                    y: pipeHeight + pipeGap,
                    height: canvas.height - (pipeHeight + pipeGap),
                    passed: false
                });
            }
            
            // Update and draw pipes
            ctx.fillStyle = '#27ae60';
            for (let i = 0; i < pipes.length; i++) {
                const pipe = pipes[i];
                
                // Update pipe position
                pipe.x -= 2;
                
                // Draw pipe
                if (i % 2 === 0) { // Top pipe
                    ctx.fillRect(pipe.x, 0, 50, pipe.height);
                } else { // Bottom pipe
                    ctx.fillRect(pipe.x, pipe.y, 50, pipe.height);
                }
                
                // Check if bird passed the pipe
                if (!pipe.passed && i % 2 === 0 && pipe.x + 50 < bird.x) {
                    pipe.passed = true;
                    score++;
                    scoreDisplay.textContent = score;
                }
                
                // Check collision
                if (checkCollision(i % 2 === 0 ? 
                    {x: pipe.x, y: 0, width: 50, height: pipe.height} : 
                    {x: pipe.x, y: pipe.y, width: 50, height: pipe.height})) {
                    gameOver();
                }
            }
            
            // Remove pipes that are off screen
            pipes = pipes.filter(pipe => pipe.x + 50 > 0);
            
            // Check if bird hit the ground or ceiling
            if (bird.y - bird.height < 0 || bird.y + bird.height > canvas.height) {
                gameOver();
            }
            
            frameCount++;
            requestAnimationFrame(gameLoop);
        }
        
        // Collision detection
        function checkCollision(pipe) {
            return bird.x + bird.width > pipe.x && 
                   bird.x < pipe.x + pipe.width && 
                   bird.y - bird.height < pipe.y + pipe.height && 
                   bird.y + bird.height > pipe.y;
        }
        
        // Game over function
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = `Score: ${score}`;
            gameOverScreen.style.display = 'flex';
        }
        
        // Restart game function
        function restartGame() {
            gameOverScreen.style.display = 'none';
            startGame();
        }
        
        // Draw initial screen
        ctx.fillStyle = '#70c5ce';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    </script>
</body>
</html>

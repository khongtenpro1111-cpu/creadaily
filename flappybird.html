<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <link rel="stylesheet" href="mobile.css">
    <style>
        /* General styling for the body */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #3e3e3e;
        }

        /* Container for the game area */
        .game-container {
            position: relative;
            width: 360px;
            height: 640px;
            overflow: hidden;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            background-color: #70c5ce;
        }

        /* Background that scrolls to create a parallax effect */
        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('https://placehold.co/720x1280/70c5ce/fff?text=Flappy+Bird+Background');
            background-size: cover;
            animation: scroll-bg 15s linear infinite;
        }

        /* Keyframe animation for the background scroll */
        @keyframes scroll-bg {
            from {
                background-position: 0 0;
            }
            to {
                background-position: -720px 0;
            }
        }

        /* Styling for the bird element */
        .bird {
            position: absolute;
            width: 40px;
            height: 30px;
            left: 50px;
            top: 50%;
            background-image: url('https://placehold.co/40x30/ffca00/000?text=Bird');
            background-size: cover;
            z-index: 10;
            transition: transform 0.2s ease-out; /* Smooth rotation transition */
        }

        /* Styling for a single pipe */
        .pipe {
            position: absolute;
            width: 60px;
            background-color: #558B2F;
            border: 2px solid #33691E;
            border-top: none;
            box-sizing: border-box;
            z-index: 5;
        }

        /* Styling for the top part of the pipe */
        .pipe-top {
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            top: 0;
        }

        /* Styling for the bottom part of the pipe */
        .pipe-bottom {
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            bottom: 0;
        }
        
        /* The score display */
        .score {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 3em;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px #000;
            z-index: 20;
        }

        /* Base styling for the game overlay screens (start, game over) */
        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            text-align: center;
            z-index: 30;
        }

        /* Styling for the overlay title */
        .overlay-title {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Styling for the instruction/final score text */
        .overlay-text {
            font-size: 1.5em;
            margin-bottom: 30px;
        }

        /* Styling for the action button */
        .overlay-button {
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            color: #fff;
            background-color: #2c3e50;
            border: 2px solid #fff;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        /* Hover effect for the button */
        .overlay-button:hover {
            background-color: #34495e;
            transform: scale(1.05);
        }

        /* Active effect for the button */
        .overlay-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="background"></div>
        <div class="score" id="score">0</div>
        <div class="bird" id="bird"></div>
        
        <!-- Start screen -->
        <div class="game-overlay" id="start-screen">
            <h1 class="overlay-title">Flappy Bird</h1>
            <p class="overlay-text">Click or press Space to start and jump!</p>
            <button class="overlay-button" id="start-button">Start Game</button>
        </div>

        <!-- Game over screen (initially hidden) -->
        <div class="game-overlay" id="game-over-screen" style="display: none;">
            <h1 class="overlay-title">Game Over!</h1>
            <p class="overlay-text">Your Score: <span id="final-score">0</span></p>
            <button class="overlay-button" id="restart-button">Restart</button>
        </div>
    </div>

    <script>
        // DOM element references
        const gameContainer = document.querySelector('.game-container');
        const bird = document.getElementById('bird');
        const scoreDisplay = document.getElementById('score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreDisplay = document.getElementById('final-score');
        const startButton = document.getElementById('start-button');
        const restartButton = document.getElementById('restart-button');

        // Game state variables
        let isGameStarted = false;
        let isGameOver = false;
        let score = 0;
        let birdPosition = 300; // Initial bird vertical position
        let birdVelocity = 0;
        const gravity = 0.5; // How fast the bird falls
        const jumpStrength = -8; // How high the bird jumps
        const pipeSpeed = 2; // How fast pipes move
        const pipeInterval = 2000; // Time in ms between new pipes
        const pipeGap = 150; // The vertical gap between pipes
        
        let pipes = [];
        let animationFrameId; // To control the requestAnimationFrame loop
        let pipeIntervalId; // To control the setInterval for pipe generation

        // Event listener for starting the game
        startButton.addEventListener('click', startGame);
        
        // --- ADDED THIS LINE ---
        // The restart button now directly starts the game
        restartButton.addEventListener('click', startGame);

        // Event listeners for bird jump
        document.addEventListener('keydown', handleJump);
        gameContainer.addEventListener('mousedown', handleJump);

        /**
         * Initializes and starts the game.
         */
        function startGame() {
            if (isGameStarted) return; // Prevent multiple starts
            isGameStarted = true;
            isGameOver = false;
            score = 0;
            birdPosition = 300;
            birdVelocity = 0;
            scoreDisplay.textContent = score;
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';

            // Clear any existing pipes from a previous game
            pipes.forEach(pipe => pipe.top.remove());
            pipes.forEach(pipe => pipe.bottom.remove());
            pipes = [];

            // Start the game loop and pipe generation
            animationFrameId = requestAnimationFrame(gameLoop);
            pipeIntervalId = setInterval(generatePipe, pipeInterval);
        }

        /**
         * Main game loop that updates the state of the game on every frame.
         */
        function gameLoop() {
            if (isGameOver) {
                cancelAnimationFrame(animationFrameId);
                clearInterval(pipeIntervalId);
                return;
            }

            // Update bird position and velocity
            birdVelocity += gravity;
            birdPosition += birdVelocity;
            bird.style.top = `${birdPosition}px`;

            // Rotate the bird based on its velocity
            const rotation = Math.min(Math.max(-45, birdVelocity * 5), 90);
            bird.style.transform = `rotate(${rotation}deg)`;

            // Move pipes and check for collisions
            movePipes();
            checkCollisions();
            updateScore();

            // Continue the game loop
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        /**
         * Handles the bird's jump action.
         * @param {Event} e The event object from keydown or mousedown.
         */
        function handleJump(e) {
            if (isGameStarted && !isGameOver && (e.key === ' ' || e.type === 'mousedown')) {
                birdVelocity = jumpStrength;
            }
        }

        /**
         * Generates a new pair of pipes (top and bottom) and adds them to the game.
         */
        function generatePipe() {
            const minGap = 100;
            const maxGap = 250;
            const randomGapHeight = Math.floor(Math.random() * (maxGap - minGap + 1)) + minGap;

            const pipePosition = gameContainer.clientWidth;
            const pipeTopHeight = Math.random() * (gameContainer.clientHeight - pipeGap - 100) + 50;

            // Create top pipe element
            const topPipe = document.createElement('div');
            topPipe.classList.add('pipe', 'pipe-top');
            topPipe.style.height = `${pipeTopHeight}px`;
            topPipe.style.left = `${pipePosition}px`;
            gameContainer.appendChild(topPipe);

            // Create bottom pipe element
            const bottomPipe = document.createElement('div');
            bottomPipe.classList.add('pipe', 'pipe-bottom');
            bottomPipe.style.height = `${gameContainer.clientHeight - pipeTopHeight - pipeGap}px`;
            bottomPipe.style.left = `${pipePosition}px`;
            gameContainer.appendChild(bottomPipe);

            // Add new pipes to the array
            pipes.push({
                top: topPipe,
                bottom: bottomPipe,
                position: pipePosition,
                passed: false
            });
        }

        /**
         * Moves all pipes to the left and removes them when they are off-screen.
         */
        function movePipes() {
            pipes.forEach(pipe => {
                pipe.position -= pipeSpeed;
                pipe.top.style.left = `${pipe.position}px`;
                pipe.bottom.style.left = `${pipe.position}px`;

                // Remove pipes that are off-screen to the left
                if (pipe.position + 60 < 0) {
                    pipe.top.remove();
                    pipe.bottom.remove();
                }
            });
            // Filter out the pipes that have been removed
            pipes = pipes.filter(pipe => pipe.position + 60 >= 0);
        }

        /**
         * Checks for collisions between the bird and the ground or pipes.
         */
        function checkCollisions() {
            const birdRect = bird.getBoundingClientRect();
            const gameRect = gameContainer.getBoundingClientRect();

            // Collision with the ground or ceiling
            if (birdPosition + birdRect.height > gameRect.height || birdPosition < 0) {
                endGame();
                return;
            }

            // Collision with pipes
            pipes.forEach(pipe => {
                const topPipeRect = pipe.top.getBoundingClientRect();
                const bottomPipeRect = pipe.bottom.getBoundingClientRect();

                // Check for horizontal and vertical overlap with either pipe
                if (birdRect.left < topPipeRect.right &&
                    birdRect.right > topPipeRect.left &&
                    (birdRect.top < topPipeRect.bottom || birdRect.bottom > bottomPipeRect.top)) {
                    endGame();
                }
            });
        }

        /**
         * Increments the score when the bird successfully passes a pipe.
         */
        function updateScore() {
            pipes.forEach(pipe => {
                const birdLeft = bird.getBoundingClientRect().left;
                const pipeRight = pipe.top.getBoundingClientRect().right;

                // Check if the bird has passed the pipe and hasn't been scored yet
                if (!pipe.passed && birdLeft > pipeRight) {
                    score++;
                    scoreDisplay.textContent = score;
                    pipe.passed = true; // Mark as passed to prevent multiple scores
                }
            });
        }

        /**
         * Ends the game and shows the game over screen.
         */
        function endGame() {
            isGameOver = true;
            finalScoreDisplay.textContent = score;
            gameOverScreen.style.display = 'flex';
        }

        /**
         * Resets the game to its initial state for a new round.
         */
        // --- REMOVED THIS FUNCTION ---
        // function restartGame() {
        //     isGameOver = false;
        //     isGameStarted = false;
        //     startScreen.style.display = 'flex';
        // }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ Ghi Chú Nhanh</title>
    <link rel="icon" type="image/png" href="img/logo/favicon-round.png">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            padding-bottom: 60px;
        }

        h1, h2, h3, h4 {
            font-weight: 600;
        }

        /* ==================== GIAO DIỆN CHÍNH CỦA CÔNG CỤ ==================== */
        .notes-app-container {
            max-width: 1050px;
            min-height: 600px;
            margin: 0 auto 50px;
            padding: 24px;
            background: var(--card-bg) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-lg, 20px) !important;
            border: 1px solid var(--card-border) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4) !important;
            display: flex;
            gap: 24px;
            text-align: left;
            transition: all 0.3s ease;
        }

        .notes-sidebar {
            width: 320px;
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md, 14px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex-shrink: 0;
        }

        .notes-sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        .notes-sidebar-header h3 {
            font-size: 1.15rem;
            color: var(--text-color);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .notes-search-box {
            position: relative;
            width: 100%;
        }

        .notes-search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary-text-color);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .notes-sidebar input[type="text"] {
            width: 100%;
            padding: 10px 12px 10px 36px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: rgba(0, 0, 0, 0.25);
            color: var(--text-color);
            font-size: 0.9rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .notes-sidebar input[type="text"]:focus {
            border-color: var(--main-color);
            box-shadow: 0 0 8px var(--glow-color);
        }

        .add-note-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--main-color), #4361ee);
            color: white;
            padding: 11px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .add-note-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--glow-color);
        }

        .note-list {
            list-style: none !important;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
            max-height: 380px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .note-list li {
            list-style: none !important;
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            padding: 12px 14px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            transition: all 0.25s ease;
            position: relative;
            word-break: break-word;
            display: flex;
            align-items: center;
        }

        .note-list li:hover {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(3px);
        }

        .note-list li.active {
            background: linear-gradient(135deg, rgba(247, 37, 133, 0.18), rgba(79, 70, 229, 0.18));
            border-color: var(--main-color);
            box-shadow: 0 4px 12px rgba(247, 37, 133, 0.2);
        }

        .note-list li.no-notes {
            text-align: center;
            color: var(--secondary-text-color);
            padding: 24px 12px;
            background: transparent;
            border: none;
            cursor: default;
            justify-content: center;
        }
        .note-list li.no-notes:hover {
            transform: none;
            background: transparent;
        }

        .notes-data-controls {
            display: flex;
            gap: 8px;
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid var(--card-border);
        }

        .notes-data-controls button {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-color);
            padding: 9px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .notes-data-controls button:hover {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .notes-main-content {
            flex: 1;
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md, 14px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .note-title-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: rgba(0, 0, 0, 0.25);
            color: var(--text-color);
            font-size: 1.15rem;
            font-weight: 600;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        .note-title-input:focus {
            border-color: var(--main-color);
            box-shadow: 0 0 8px var(--glow-color);
        }

        .notes-main-content textarea {
            flex: 1;
            min-height: 350px;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: rgba(0, 0, 0, 0.25);
            color: var(--text-color);
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.6;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        .notes-main-content textarea:focus {
            border-color: var(--main-color);
            box-shadow: 0 0 8px var(--glow-color);
        }

        .notes-controls {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding-top: 6px;
        }

        .notes-controls button {
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        #save-note-btn {
            background: linear-gradient(135deg, var(--button-success, #10b981), #059669);
            color: white;
        }
        #save-note-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        #delete-note-btn {
            background: linear-gradient(135deg, var(--button-danger, #ef4444), #dc2626);
            color: white;
        }
        #delete-note-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .notification {
            position: fixed;
            top: 80px;
            right: 20px;
            left: auto;
            transform: translateY(-20px);
            opacity: 0;
            pointer-events: none;
            padding: 12px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 2000;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .notification.success {
            background: rgba(16, 185, 129, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .notification.error {
            background: rgba(239, 68, 68, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* ==================== MEDIA QUERIES (RESPONSIVE) ==================== */
        @media (max-width: 820px) {
            .notes-app-container {
                flex-direction: column;
                padding: 16px;
            }
            .notes-sidebar {
                width: 100%;
            }
            .note-list {
                max-height: 220px;
            }
            .notes-main-content textarea {
                min-height: 260px;
            }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>
    <div id="sidebar-placeholder"></div>
    <div id="notification-bar" class="notification"></div>

    <header class="header-inspiration" style="padding: 3rem 1rem; text-align: center;">
        <h1><i class="fas fa-sticky-note" style="margin-right: 10px; color: var(--main-color);"></i>Công Cụ Ghi Chú Nhanh</h1>
        <p>Nơi lưu trữ những ý tưởng và ghi nhớ quan trọng</p>
    </header>

    <main>
        <div class="notes-app-container">
            <div class="notes-sidebar">
                <div class="notes-sidebar-header">
                    <h3><i class="fas fa-list-ul" style="color: var(--main-color);"></i> Danh sách ghi chú</h3>
                </div>
                <div class="notes-search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-note-input" placeholder="Tìm kiếm ghi chú...">
                </div>
                <button id="add-note-btn" class="add-note-btn">
                    <i class="fas fa-plus"></i> Thêm ghi chú mới
                </button>
                <ul id="note-list" class="note-list">
                </ul>
                <div class="notes-data-controls">
                    <button id="export-notes-btn"><i class="fas fa-download"></i> Xuất</button>
                    <input type="file" id="import-notes-file" style="display: none;" accept=".json">
                    <button id="import-notes-btn"><i class="fas fa-upload"></i> Nhập</button>
                </div>
            </div>
            <div class="notes-main-content">
                <input type="text" id="note-title-input" class="note-title-input" placeholder="Nhập tiêu đề ghi chú...">
                <textarea id="note-text-area" placeholder="Bắt đầu ghi chú của bạn ở đây..."></textarea>
                <div class="notes-controls">
                    <button id="save-note-btn"><i class="fas fa-save"></i> Lưu ghi chú</button>
                    <button id="delete-note-btn"><i class="fas fa-trash-alt"></i> Xóa ghi chú</button>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <div id="music-placeholder"></div>
    <div id="modals-placeholder"></div>

    <script src="layout.js"></script>
    <script src="main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const notesTextarea = document.getElementById('note-text-area');
            const noteTitleInput = document.getElementById('note-title-input');
            const addNoteBtn = document.getElementById('add-note-btn');
            const deleteNoteBtn = document.getElementById('delete-note-btn');
            const noteListEl = document.getElementById('note-list');
            const searchNoteInput = document.getElementById('search-note-input');
            const exportNotesBtn = document.getElementById('export-notes-btn');
            const importNotesBtn = document.getElementById('import-notes-btn');
            const importNotesFileEl = document.getElementById('import-notes-file');
            const notificationBar = document.getElementById('notification-bar');
            const saveNoteBtn = document.getElementById('save-note-btn');
            
            let notes = JSON.parse(localStorage.getItem('notes')) || [];
            let selectedNoteId = null;

            function showNotification(message, type) {
                notificationBar.textContent = message;
                notificationBar.className = 'notification show ' + type;
                setTimeout(() => {
                    notificationBar.classList.remove('show');
                }, 2000);
            }

            function saveNotes() {
                localStorage.setItem('notes', JSON.stringify(notes));
            }

            function escapeHtml(str) {
                return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            function renderNoteList(searchTerm = '') {
                noteListEl.innerHTML = '';
                const filteredNotes = notes.filter(note => (note.title || '').toLowerCase().includes(searchTerm.toLowerCase()));
                
                if (filteredNotes.length === 0 && notes.length > 0) {
                    noteListEl.innerHTML = '<li class="no-notes"><i class="fas fa-search" style="margin-right: 6px;"></i> Không tìm thấy ghi chú</li>';
                    return;
                } else if (notes.length === 0) {
                    noteListEl.innerHTML = '<li class="no-notes"><i class="fas fa-inbox" style="margin-right: 6px;"></i> Chưa có ghi chú nào.</li>';
                    return;
                }

                filteredNotes.forEach(note => {
                    const li = document.createElement('li');
                    li.innerHTML = `<i class="far fa-file-alt" style="margin-right: 8px; color: var(--main-color); flex-shrink: 0;"></i><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;">${escapeHtml(note.title)}</span>`;
                    li.dataset.id = note.id;
                    li.classList.add(note.id === selectedNoteId ? 'active' : '');
                    noteListEl.appendChild(li);
                });
            }

            function loadNote() {
                if (selectedNoteId) {
                    const selectedNote = notes.find(note => note.id === selectedNoteId);
                    if (selectedNote) {
                        noteTitleInput.value = selectedNote.title;
                        notesTextarea.value = selectedNote.content;
                        deleteNoteBtn.style.display = 'inline-flex';
                        saveNoteBtn.style.display = 'inline-flex';
                    }
                } else {
                    noteTitleInput.value = '';
                    notesTextarea.value = '';
                    deleteNoteBtn.style.display = 'none';
                    saveNoteBtn.style.display = 'none';
                }
            }
            
            function addNewNote() {
                const newNote = {
                    id: Date.now(),
                    title: 'Ghi chú mới',
                    content: ''
                };
                notes.unshift(newNote);
                selectedNoteId = newNote.id;
                saveNotes();
                renderNoteList();
                loadNote();
                showNotification('Đã thêm ghi chú mới!', 'success');
            }

            function saveCurrentNote() {
                if (selectedNoteId) {
                    const selectedNote = notes.find(note => note.id === selectedNoteId);
                    if (selectedNote) {
                        selectedNote.title = noteTitleInput.value || 'Ghi chú không tiêu đề';
                        selectedNote.content = notesTextarea.value;
                        saveNotes();
                        renderNoteList(searchNoteInput.value);
                        showNotification('Đã lưu ghi chú!', 'success');
                    }
                }
            }

            function deleteNote() {
                if (selectedNoteId && confirm('Bạn có chắc chắn muốn xóa ghi chú này không?')) {
                    notes = notes.filter(note => note.id !== selectedNoteId);
                    selectedNoteId = notes.length > 0 ? notes[0].id : null;
                    saveNotes();
                    renderNoteList();
                    loadNote();
                    showNotification('Đã xóa ghi chú!', 'error');
                }
            }
            
            function exportNotes() {
                const dataStr = JSON.stringify(notes, null, 2);
                const blob = new Blob([dataStr], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'notes-backup.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
            
            function importNotes() {
                importNotesFileEl.click();
            }

            function handleImportFile(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const importedNotes = JSON.parse(e.target.result);
                        if (Array.isArray(importedNotes)) {
                            notes = importedNotes;
                            selectedNoteId = notes.length > 0 ? notes[0].id : null;
                            saveNotes();
                            renderNoteList();
                            loadNote();
                        } else {
                            alert('Tệp tin không hợp lệ.');
                        }
                    } catch (error) {
                        alert('Lỗi khi đọc tệp tin!');
                    }
                };
                reader.readAsText(file);
            }


            addNoteBtn.addEventListener('click', addNewNote);
            deleteNoteBtn.addEventListener('click', deleteNote);
            saveNoteBtn.addEventListener('click', saveCurrentNote);
            noteListEl.addEventListener('click', (e) => {
                const li = e.target.closest('li');
                if (li) {
                    selectedNoteId = parseInt(li.dataset.id);
                    renderNoteList(searchNoteInput.value);
                    loadNote();
                }
            });
            noteTitleInput.addEventListener('input', saveCurrentNote);
            notesTextarea.addEventListener('input', saveCurrentNote);
            searchNoteInput.addEventListener('input', (e) => renderNoteList(e.target.value));
            exportNotesBtn.addEventListener('click', exportNotes);
            importNotesBtn.addEventListener('click', importNotes);
            importNotesFileEl.addEventListener('change', handleImportFile);

            if (notes.length > 0 && selectedNoteId === null) {
                selectedNoteId = notes[0].id;
            }

            renderNoteList();
            loadNote();
        });
    </script>
</body>
</html>
